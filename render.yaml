services:
  - type: web
    name: atf-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: atf-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true

  - type: worker
    name: atf-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: atf-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: atf-redis
          type: redis
          property: connectionString
      - key: ENCRYPTION_KEY
        fromService:
          name: atf-web
          type: web
          property: envVars.ENCRYPTION_KEY

  - type: redis
    name: atf-redis
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  - name: atf-db
    plan: starter
